<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding so the browser reads text properly -->
  <meta charset="UTF-8">

  <!-- Ensures the layout adapts to mobile screens and different devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title that appears in the browser tab -->
  <title>Contact | Ray Espinoza</title>

  <!-- Link to the main stylesheet shared across the entire website -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Header area containing the page title and navigation bar -->
  <header>
    <h1>Contact Me</h1>

    <!-- Navigation menu for moving between pages -->
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Main content section that holds the contact form -->
  <main>
    <section>
      <!-- Subheading for the contact section -->
      <h2>Get in Touch</h2>

      <!-- 
        Contact form using Formspree backend.
        'action' sends the form data to a Formspree endpoint.
        'method="POST"' ensures data is securely submitted.
         Form ID was created on formspree to track contact form
      -->
      <form action="https://formspree.io/f/xpwvyokd" method="POST">

        <!-- Full name input field -->
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <!-- Email address field. '_replyto' is required by Formspree to send email replies. -->
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>

        <!-- Message text box allowing users to type their message -->
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <!-- Form submission button -->
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- Footer section appearing on every page -->
  <footer>
    <p>© 2025 Ray Espinoza</p>
  </footer>
</body>
</html>
